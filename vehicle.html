<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vehículo | AutoVision AI</title><link rel="stylesheet" href="src/styles.css"><link rel="stylesheet" href="src/public.css"></head><body><main class="public-page" id="app"><p>Cargando vehículo…</p></main><script>
const key='sb_publishable_dvwP1aVUTSHvmNcqn-IDEw_f0R2KO7D',base='https://rebzpikwqxmwajdimfld.supabase.co/rest/v1/vehicles';
const params=new URLSearchParams(location.search),brand=params.get('brand'),model=params.get('model');
const app=document.getElementById('app');
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(!brand||!model){app.innerHTML='<p>Vehículo no encontrado.</p>'}else{fetch(`${base}?select=*&brand=eq.${encodeURIComponent(brand)}&model=eq.${encodeURIComponent(model)}&limit=1`,{headers:{apikey:key,Authorization:'Bearer '+key}}).then(r=>r.json()).then(data=>{const v=data[0];if(!v)throw Error();const share=location.href;const qr='https://api.qrserver.com/v1/create-qr-code/?size=260x260&data='+encodeURIComponent(share);const message=encodeURIComponent(`Hola, quiero consultar por el ${v.brand} ${v.model}.`);app.innerHTML=`<a class="back public-back" href="index.html">← AutoVision AI</a><div class="public-grid"><section><img class="public-hero" src="${esc(v.cover_image_url)}" alt="${esc(v.brand)} ${esc(v.model)}"><div class="vehicle-public-data"><p class="eyebrow">${esc(v.status==='reserved'?'RESERVADO':'DISPONIBLE')} · AUTOVISION AI</p><h1>${esc(v.brand)} ${esc(v.model)}</h1><p class="price">${esc(v.currency||'USD')} ${Number(v.price).toLocaleString('es-UY')}</p><div class="specs"><span>${esc(v.year)}</span><span>${Number(v.mileage||0).toLocaleString('es-UY')} km</span><span>${esc(v.transmission||'Automático')}</span><span>${esc(v.fuel_type||'No especificado')}</span></div><p class="muted">${esc(v.description||'Consultá disponibilidad y condiciones de este vehículo.')}</p><a class="whatsapp public-action" href="https://wa.me/?text=${message}" target="_blank" rel="noopener">Consultar por WhatsApp</a></div></section><aside class="qr-card"><h2>Escaneá y compartí</h2><p class="muted">Este QR lleva directamente a esta ficha.</p><img src="${qr}" alt="Código QR para ${esc(v.brand)} ${esc(v.model)}"><button onclick="navigator.clipboard.writeText(location.href).then(()=>this.textContent='Enlace copiado')">Copiar enlace</button></aside></div>`}).catch(()=>app.innerHTML='<p>Este vehículo no está disponible o no existe.</p>')}
</script></body></html>
